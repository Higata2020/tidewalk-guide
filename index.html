<!DOCTYPE html>

<title>タイドウォーク案内</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px 20px 100vh;background:#d3d3d3;color:#000;font-family:sans-serif;font-size:16px;line-height:1.9}
main{max-width:760px;margin:0 auto}
h1{font-size:1.35rem;font-weight:normal;line-height:1.5;margin:0 0 24px}
#narration{white-space:pre-wrap;overflow-wrap:anywhere}

<body>
<main><h1 id="title"></h1><div id="narration"></div></main>
<script>
const pages = {"project": {"title": "プロジェクト「干潟と芸術」", "text": "Art and Tidal Flats　「干潟と芸術」は、槙原泰介が主催する、アーティストを中心とした緩やかな集まりです。\n東京湾に残る干潟に着目し、6年ほど前からリサーチを始め、現在に至ります。\nその間、2023年には、Vol.1の招聘作家である山田悠さんとオンライン形式でリサーチ発表を行いました。\n2024年には、槙原泰介が「内房総アートフェス」で、干潟とゴルフを題材にしたインスタレーションとツアーを行いました。\nまた、その秋にはサウンドアーティストとのコラボレーションによるワークショップを開催し、そして今年から「干潟と芸術」を開催できる運びとなりました。\nまた、アーティストだけでなく、生物や風景、環境に関心を持つ方々にも関わっていただいています。\n内房総アートフェスでの記録やレビューはWebサイトにも掲載しておりますので、またご覧いただければ幸いです。"}, "azuma": {"title": "吾妻神社", "text": "江戸時代の記録も残る、古い縁起を持つ神社です。\n房総は古来、東国へ向かう際の足がかりとなっていて、海路では神奈川方面から房総へ到着するルートがありました。\n日本神話では、ヤマトタケルノミコトが東国へ向かう際、荒波のため三浦半島から海を渡れずに困っていたところ、弟橘媛（おとたちばなひめ）が身を投じて海を鎮めたという話があります。\nその死を悼んで「君去らず」という言葉から「木更津」という地名が生まれたともいわれています。\nまた、皆さんが乗車しているこのバスは袖ヶ浦ナンバーですが、神話では、その弟橘媛の着物の袖が後に岸へ流れ着いたことから、「袖ヶ浦」という地名が起こったとされています。\n※現在は、木更津市の隣に袖ヶ浦市として市名が残っています。"}, "obitsu": {"title": "小櫃川", "text": "小櫃川は全長88kmで、上流には亀山湖、中流には久留里という江戸時代からの城下町があります。\nまた、豊富な地下水が湧き出る「名水の里」として知られています。\n房総半島は、100万年前にはもっと南の方に、火山帯の地層がある場所にわずかな陸地があるだけで、このあたりは「古東京湾」と呼ばれる海でした。\n長い年月をかけて堆積した地層は、砂と泥が交互に重なった砂泥互層といわれ、これが陸地を形成していきました。\nこの地層が、ちょうど水をろ過するフィルターのような役割を果たし、地下水を浄化しています。\n干潟は、この小櫃川の河口にあたります。"}, "banzu": {"title": "盤洲干潟", "text": "干潟は、川が長い年月をかけて削った砂や、有機物を含む土砂が東京湾に流れ出て堆積することで地形をつくるとともに、干潟の生きものに養分をもたらしています。また、潮の満ち引きや生態系の活動によって酸素を生み出すだけでなく、ここでも微生物の働きによって、ゆっくりと水をきれいにしています。\n\n自然に形成される干潟は、いわゆる潮が引いたときのみ現れる地面＝「前浜」と呼ばれる部分とともに、葦や草木が生える湿地帯＝「後浜」、もしくは「後背湿地」が存在します。この干潟は、後背湿地と干潟がセットになり、約1,400ヘクタールという広大な面積を持っていることが珍しく、日本最大級の砂質干潟と言われています。"}, "biology": {"title": "生物", "text": "少し静かに地面見つめていると、だんだんと穴からカニが出てきて、餌を食んでいます。\nこの小さなカニを「チゴガニ」といいます。\n人間も赤ちゃんのことを「稚児」といいますが、その「稚児」からきた名前です。\nチゴガニは、手先が透き通るように白く、成長してもおおよそ1cm程度にしかならないことから、そう呼ばれています。\n春先には「ウェービング」といって、両手を高く上げる行動をします。求愛行動と考えられています。\nこのチゴガニは特に素早い動きに反応して巣穴に逃げ込みます。\nですので、じっとしていれば、しゃべっていても観察することができます。"}, "plant1": {"title": "植物①", "text": "このあたりにはシャリンバイ、タイサンボク、エノキ科の市街地にも存在する樹木がいくつかみられます。\n鳥が落とした種子が育ち、自生したのかもしれません。\n一方で庭木としてもなじみ深いものです。\nこの干潟は、かつて不法投棄が絶えない場所だったようで、古い流し台などに混ざって植木も廃棄され、その結果、ここに根を張った植木もあるのではないかと推察もあります。"}, "plant2": {"title": "植物②", "text": "このあたりにはマテバシイという木があります。\nマテバシイは、この干潟では珍しいのですが、実は干潟とは密接な関係のある植物です。\n枝先がどんどん細かくなって分かれていく特徴がり、海苔養殖の道具「ノリひび」に使われていたそうです。\nこの「ひび」に付着する海苔を収穫していくわけです。\nこのマテバシイは、もともと南方、九州の方が原産で、明治時代に房総半島の南部にたくさん植林されました。\n樹齢約150年を迎えるマテバシイの森は、まさに今が使い時ともいえますが、その役目を持たないまま、房総の山々を彩っています。\nその理由の一つは、海苔の養殖方法が変わったことです。\n現在は、海苔は主に水平に張った海苔網で養殖されているため、マテバシイの「ひび」は使われなくなりました。\nまた、北九州から八幡製鐵［現在の日本製鉄］が誘致され、地域の主要産業が変化したことも原因にあります。\n山で育った木を干潟で海苔の養殖に使うという、山と海の循環の構想は、海苔から鉄への移行によって、崩れていくことになります。"}, "human": {"title": "人間", "text": "屋根にも植物が生えてしまったコンクリートの建物があります。\nこれは、この先の方角にある「浸透実験」と呼ばれる1960年代の施設の一部で、「拡散実験水路」といわれるものです。\nマップアプリで上空から見ると分かるのですが、直径65メートルほどの池の周りに堤防と水路がつくられた、二重の構造になっています。\n人工的につくられた河口湖なのですが、こちらも製鉄所の進出に関連しています。\n工業用水の需要が高まった当時、この小櫃川の河口に大きな河口湖をつくって淡水を取水する構想があり、その技術の有効性を調査するために、この池がつくられました。\nこれには千葉県以外の全国複数の自治体が出資しており、実験結果をそれぞれの地域に持ち帰り、活用することが目指されていました。\n実験終了後には、この場所にも大きな河口湖をつくる計画があったり、その後、埋め立てによる下水処理場の計画などもあったそうです。\nしかし、1973年の中東戦争をきっかけに起こったオイルショックによる経済活動の縮小、自然保護意識の高まりや漁業組合の反対などから埋め立てを免れ、放置された遺構とともに、緩やかに自然状態へと戻っていったそうです。\nここに現存する自然干潟は、東京湾では当初の10％程度だと言われています。\nこのように沿岸が直線的になっていることからも、かつての開発の跡を見ることができます。\nこちらも開発の対象だったことが分かります。\nちなみに、現在の実験池は非常に淡水に近い状態で保たれており、周りの塩湿地の中で特殊な水環境を持っています。\n野鳥の飛来地や営巣地にもなっています。\nこの実験池への道は、大半の季節は草で覆われ、たどり着くことができません。\n毎年冬場になると、野鳥観察者が道を踏み固めて、行くことができる季節があります。"}, "landscape": {"title": "風景", "text": "遠方には、君津市の製鉄所が見えます。\nこれは60年ほど前から、この風景に現れたものになります。\n右手にはアクアラインが見えます。\nこちらは1997年に開通していますので、約30年前からこの風景に加わっています。\n正面には、天候次第で富士山が見えます。\n北斎や広重が描いた上総からの海運、巨大帆船「五大力船」が行き交う姿の手前にも、ひざまで海につかる人々や、干潟の草などが描かれています。\n木更津港が今のように整備される以前、港周辺にも浅瀬が広がっており、船が近くまで着けないことから、明治後期から大正期は「海中人力車」と呼ばれるもので岸に上がっていたそうです。\n木更津以外では天草にもあったようです。"}};
const page = new URLSearchParams(window.location.search).get("page") || "project";
const selected = pages[page] || pages.project;
document.title = selected.title + "｜タイドウォーク案内";
document.getElementById("title").textContent = selected.title;
document.getElementById("narration").textContent = selected.text;
window.addEventListener("load", () => {
  const speed = 10; // スクロール速度（ピクセル/秒）
  let lastTime = null;
  function autoScroll(time) {
    if (lastTime === null) lastTime = time;
    const elapsed = time - lastTime;
    lastTime = time;
    window.scrollBy(0, speed * elapsed / 1000);
    if (window.innerHeight + window.scrollY < document.documentElement.scrollHeight - 1) {
      requestAnimationFrame(autoScroll);
    }
  }
  requestAnimationFrame(() => requestAnimationFrame(autoScroll));
});
</script>
</body>
</html>
